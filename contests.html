<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAM | Contest Management</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #063b75;
    color: white;
    padding: 15px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo {
    width: 45px;
    height: 45px;
    background: #ffd21f;
    color: #063b75;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.brand h2 {
    margin: 0;
    font-size: 18px;
}

.brand p {
    margin: 3px 0 0;
    font-size: 11px;
}

.back {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 1150px;
    margin: 30px auto;
    padding: 0 20px;
}

.top {
    background: white;
    padding: 25px;
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: 0 3px 15px rgba(0,0,0,.07);
}

.top h1 {
    margin-top: 0;
    color: #063b75;
}

.button {
    border: none;
    padding: 12px 17px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #063b75;
    color: white;
}

.yellow {
    background: #ffd21f;
    color: #063b75;
}

.danger {
    background: #c62828;
    color: white;
}

.form {
    display: none;
    background: white;
    padding: 25px;
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: 0 3px 15px rgba(0,0,0,.07);
}

.form h2 {
    color: #063b75;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd5e0;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}

.contest-list {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
}

.contest {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,.07);
    border-left: 5px solid #063b75;
}

.contest h3 {
    color: #063b75;
    margin-top: 0;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    background: #fff4c2;
    color: #725c00;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.empty {
    background: white;
    padding: 35px;
    border-radius: 14px;
    text-align: center;
    color: #687386;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
}

.success {
    display: block;
    background: #e6f7ed;
    color: #087333;
}

.error {
    display: block;
    background: #ffe8e8;
    color: #a40000;
}

.loading {
    background: white;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
}

footer {
    margin-top: 50px;
    background: #03284f;
    color: white;
    text-align: center;
    padding: 25px;
}

</style>

</head>


<body>


<header>

<div class="brand">

<div class="logo">
GAM
</div>

<div>

<h2>
GAM Contest Management
</h2>

<p>
Global Academy of Minds
</p>

</div>

</div>


<a
class="back"
href="admin.html">

← Owner Dashboard

</a>

</header>



<div class="container">


<div class="top">

<h1>
🏆 Contest Management
</h1>

<p>
Create and manage GAM academic contests.
</p>

<button
class="button primary"
id="showForm">

+ Create Contest

</button>

</div>



<!-- CREATE CONTEST -->

<div
class="form"
id="contestForm">

<h2>
Create New Contest
</h2>


<label>
Contest Name
</label>

<input
id="contestName"
type="text"
placeholder="e.g. GAM Mathematics Challenge 2026"
>


<label>
Description
</label>

<textarea
id="contestDescription"
placeholder="Enter contest description">
</textarea>


<div class="grid">


<div>

<label>
Start Date
</label>

<input
id="startDate"
type="date"
>

</div>


<div>

<label>
Start Time
</label>

<input
id="startTime"
type="time"
>

</div>


<div>

<label>
Duration (minutes)
</label>

<input
id="duration"
type="number"
value="120"
min="1"
>

</div>

</div>


<label>
Contest Status
</label>

<select id="contestStatus">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

</select>


<br><br>


<button
class="button primary"
id="saveContest">

Save Contest

</button>


<button
class="button danger"
id="cancelForm">

Cancel

</button>


<div
id="message"
class="message">

</div>

</div>



<!-- CONTEST LIST -->

<h2>
Your Contests
</h2>

<div
id="contestList"
class="contest-list">

<div class="loading">
Loading contests...
</div>

</div>


</div>



<footer>

<strong>
GAM — Global Academy of Minds
</strong>

<p>
Learn • Compete • Excel
</p>

</footer>



<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyB_Hd_LkXjPKMyUJUD-ob2m4rOFepm9niU",

    authDomain:
        "gam-platform-59f1c.firebaseapp.com",

    projectId:
        "gam-platform-59f1c",

    storageBucket:
        "gam-platform-59f1c.firebasestorage.app",

    messagingSenderId:
        "423635446027",

    appId:
        "1:423635446027:web:7b42cd097b928ed7671a0e"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const OWNER_UID =
    "Ib6GNciZ5kOEbOcCRlMLURoNTXG2";


const form =
    document.getElementById(
        "contestForm"
    );


const list =
    document.getElementById(
        "contestList"
    );


const message =
    document.getElementById(
        "message"
    );


let currentUser = null;



/* AUTHENTICATION */

onAuthStateChanged(
    auth,
    async function(user) {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        if (
            user.uid !== OWNER_UID
        ) {

            document.body.innerHTML =
                "<h2 style='text-align:center;margin-top:100px;color:#a40000'>" +
                "Access denied. Owner only." +
                "</h2>";

            return;

        }


        currentUser = user;

        await loadContests();

    }
);



/* OPEN FORM */

document
.getElementById("showForm")
.addEventListener(
    "click",
    function() {

        form.style.display =
            "block";

        window.scrollTo(
            0,
            300
        );

    }
);



/* CLOSE FORM */

document
.getElementById("cancelForm")
.addEventListener(
    "click",
    function() {

        form.style.display =
            "none";

    }
);



/* SAVE CONTEST */

document
.getElementById("saveContest")
.addEventListener(
    "click",
    async function() {

        const name =
            document
            .getElementById("contestName")
            .value
            .trim();

        const description =
            document
            .getElementById("contestDescription")
            .value
            .trim();

        const startDate =
            document
            .getElementById("startDate")
            .value;

        const startTime =
            document
            .getElementById("startTime")
            .value;

        const duration =
            Number(
                document
                .getElementById("duration")
                .value
            );

        const status =
            document
            .getElementById("contestStatus")
            .value;


        if (
            !name ||
            !startDate ||
            !startTime ||
            !duration
        ) {

            showMessage(
                "Please complete the contest name, date, time and duration.",
                "error"
            );

            return;

        }


        if (!currentUser) {

            showMessage(
                "Owner authentication is not ready. Please refresh the page.",
                "error"
            );

            return;

        }


        try {

            document
            .getElementById("saveContest")
            .disabled = true;


            const contestData = {

                name:
                    name,

                description:
                    description,

                startDate:
                    startDate,

                startTime:
                    startTime,

                duration:
                    duration,

                status:
                    status,

                createdBy:
                    currentUser.uid,

                createdByEmail:
                    currentUser.email,

                createdAt:
                    serverTimestamp()

            };


            const contestRef =
                await addDoc(
                    collection(
                        db,
                        "contests"
                    ),
                    contestData
                );


            showMessage(
                "✓ Contest saved successfully. ID: " +
                contestRef.id,
                "success"
            );


            document
            .getElementById("contestName")
            .value = "";

            document
            .getElementById("contestDescription")
            .value = "";

            document
            .getElementById("startDate")
            .value = "";

            document
            .getElementById("startTime")
            .value = "";

            document
            .getElementById("duration")
            .value = "120";

            document
            .getElementById("contestStatus")
            .value = "draft";


            await loadContests();

        }

        catch(error) {

            console.error(
                error
            );

            showMessage(
                "Could not save contest: " +
                error.message,
                "error"
            );

        }

        finally {

            document
            .getElementById("saveContest")
            .disabled = false;

        }

    }
);



/* LOAD CONTESTS */

async function loadContests() {

    try {

        list.innerHTML =
            '<div class="loading">Loading contests...</div>';


        const contestsRef =
            collection(
                db,
                "contests"
            );


        const snapshot =
            await getDocs(
                contestsRef
            );


        if (
            snapshot.empty
        ) {

            list.innerHTML =
                '<div class="empty">' +
                'No contests created yet.' +
                '</div>';

            return;

        }


        list.innerHTML = "";


        snapshot.forEach(
            function(doc) {

                const contest =
                    doc.data();


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "contest";


                card.innerHTML =

                    "<h3>" +
                    escapeHTML(
                        contest.name ||
                        "Unnamed Contest"
                    ) +
                    "</h3>" +

                    "<span class='status'>" +
                    escapeHTML(
                        contest.status ||
                        "draft"
                    ) +
                    "</span>" +

                    "<p>" +
                    escapeHTML(
                        contest.description ||
                        "No description."
                    ) +
                    "</p>" +

                    "<p><strong>Date:</strong> " +
                    escapeHTML(
                        contest.startDate ||
                        "-"
                    ) +
                    "</p>" +

                    "<p><strong>Time:</strong> " +
                    escapeHTML(
                        contest.startTime ||
                        "-"
                    ) +
                    "</p>" +

                    "<p><strong>Duration:</strong> " +
                    escapeHTML(
                        String(
                            contest.duration ||
                            "-"
                        )
                    ) +
                    " minutes</p>" +

                    "<p><small>ID: " +
                    escapeHTML(
                        doc.id
                    ) +
                    "</small></p>" +

                    "<div class='actions'>" +

                    "<button class='button primary' " +
                    "onclick=\"buildPaper('" +
                    encodeURIComponent(
                        doc.id
                    ) +
                    "')\">" +
                    "Build Paper" +
                    "</button>" +

                    "<button class='button yellow' " +
                    "onclick=\"previewContest('" +
                    encodeURIComponent(
                        doc.id
                    ) +
                    "')\">" +
                    "Preview" +
                    "</button>" +

                    "</div>";


                list.appendChild(
                    card
                );

            }
        );

    }

    catch(error) {

        console.error(
            error
        );

        list.innerHTML =
            '<div class="empty">' +
            'Unable to load contests.<br><br>' +
            escapeHTML(
                error.message
            ) +
            '</div>';

    }

}



/* MESSAGE */

function showMessage(
    text,
    type
) {

    message.className =
        "message " +
        type;

    message.textContent =
        text;

}



/* SAFE HTML */

function escapeHTML(
    value
) {

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



/* PAPER BUILDER - NEXT STAGE */

window.buildPaper =
    function(id) {

        const contestId =
            decodeURIComponent(
                id
            );

        alert(
            "Paper Builder for contest " +
            contestId +
            " will be connected next."
        );

    };



/* PREVIEW - NEXT STAGE */

window.previewContest =
    function(id) {

        const contestId =
            decodeURIComponent(
                id
            );

        alert(
            "Contest Preview for " +
            contestId +
            " will be connected next."
        );

    };

</script>

</body>

    </html>
