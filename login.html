<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GAM | Login</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    min-height: 100vh;
}

nav {
    background: #063b75;
    color: white;
    padding: 14px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo {
    width: 44px;
    height: 44px;
    background: #ffd21f;
    color: #063b75;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.brand h2 {
    font-size: 18px;
}

.brand p {
    font-size: 10px;
}

.home {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 450px;
    margin: 55px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px 25px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h1 {
    color: #063b75;
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #687386;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 17px;
    border: 1px solid #ccd5e0;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    background: #ffd21f;
    color: #063b75;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

#message {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 7px;
    display: none;
}

.error {
    display: block !important;
    background: #ffe8e8;
    color: #a40000;
}

.success {
    display: block !important;
    background: #e6f7ed;
    color: #087333;
}

footer {
    background: #03284f;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
}

</style>

</head>


<body>


<nav>

<div class="brand">

<div class="logo">
GAM
</div>

<div>

<h2>GAM</h2>

<p>
Global Academy of Minds
</p>

</div>

</div>


<a
class="home"
href="index.html">

Home

</a>

</nav>



<div class="container">

<div class="card">

<h1>
Welcome Back
</h1>

<p class="subtitle">
Login to your GAM account
</p>


<div id="message"></div>


<form id="loginForm">


<label>
Email Address
</label>

<input
id="email"
type="email"
required
autocomplete="email"
>


<label>
Password
</label>

<input
id="password"
type="password"
required
autocomplete="current-password"
>


<button
id="loginButton"
type="submit">

Login

</button>


</form>

</div>

</div>



<footer>

<strong>
GAM — Global Academy of Minds
</strong>

<p>
Learn • Compete • Excel
</p>

</footer>



<script type="module">


import {
    initializeApp
}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDocFromServer
}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



const firebaseConfig = {

    apiKey:
        "AIzaSyB_Hd_LkXjPKMyUJUD-ob2m4rOFepm9niU",

    authDomain:
        "gam-platform-59f1c.firebaseapp.com",

    projectId:
        "gam-platform-59f1c",

    storageBucket:
        "gam-platform-59f1c.firebasestorage.app",

    messagingSenderId:
        "423635446027",

    appId:
        "1:423635446027:web:7b42cd097b928ed7671a0e"

};



const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const form =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const button =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );



function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        type;

}



form.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        button.disabled =
            true;


        button.textContent =
            "Checking...";


        try {


            const result =
                await signInWithEmailAndPassword(
                    auth,
                    emailInput.value.trim(),
                    passwordInput.value
                );


            const user =
                result.user;


            showMessage(
                "Login successful. Checking GAM profile...",
                "success"
            );


            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const snapshot =
                await getDocFromServer(
                    userRef
                );


            if (!snapshot.exists()) {


                showMessage(
                    "SERVER: GAM profile not found for UID: " +
                    user.uid,
                    "error"
                );


                button.disabled =
                    false;


                button.textContent =
                    "Login";


                return;

            }


            const data =
                snapshot.data();


            const role =
                data.role;


            if (role === "owner") {


                showMessage(
                    "OWNER CONFIRMED. Opening Admin Dashboard...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "admin.html";

                    },
                    800
                );


                return;

            }


            if (role === "admin") {


                showMessage(
                    "ADMIN CONFIRMED. Opening Admin Dashboard...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "admin.html";

                    },
                    800
                );


                return;

            }


            if (role === "student") {


                showMessage(
                    "STUDENT ACCOUNT. Opening Student Dashboard...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    800
                );


                return;

            }


            showMessage(
                "Unknown GAM role: " +
                role,
                "error"
            );


            button.disabled =
                false;


            button.textContent =
                "Login";


        }

        catch (error) {


            console.error(
                error
            );


            showMessage(
                "Firestore error: " +
                error.code +
                " — " +
                error.message,
                "error"
            );


            button.disabled =
                false;


            button.textContent =
                "Login";

        }

    }
);


</script>

</body>

      </html>
