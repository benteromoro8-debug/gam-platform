<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GAM | Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: #063b75;
            color: white;
            padding: 14px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 44px;
            height: 44px;
            background: #ffd21f;
            color: #063b75;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .brand h2 {
            font-size: 18px;
        }

        .brand p {
            font-size: 10px;
            opacity: .85;
        }

        .home-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 55px auto;
            padding: 0 20px;
            flex: 1;
        }

        .login-card {
            background: white;
            padding: 34px 27px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(0,0,0,.08);
        }

        .login-card h1 {
            color: #063b75;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #687386;
            font-size: 14px;
            margin-bottom: 26px;
        }

        label {
            display: block;
            color: #26364a;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd5e0;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 17px;
            outline: none;
        }

        input:focus {
            border-color: #063b75;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #ffd21f;
            color: #063b75;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:disabled {
            opacity: .6;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
            color: #063b75;
            font-size: 13px;
            text-decoration: none;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 17px;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #ffe8e8;
            color: #a40000;
        }

        .success {
            display: block;
            background: #e6f7ed;
            color: #087333;
        }

        .register-text {
            text-align: center;
            margin-top: 21px;
            color: #687386;
            font-size: 14px;
        }

        .register-text a {
            color: #063b75;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            background: #03284f;
            color: white;
            text-align: center;
            padding: 25px;
            font-size: 13px;
        }

        footer p {
            color: #b9c9dc;
            margin-top: 6px;
        }

    </style>

</head>


<body>


<nav>

    <div class="brand">

        <div class="logo">
            GAM
        </div>

        <div>
            <h2>GAM</h2>
            <p>Global Academy of Minds</p>
        </div>

    </div>

    <a href="index.html" class="home-link">
        Home
    </a>

</nav>


<div class="container">

    <div class="login-card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your GAM account
        </p>

        <div id="message" class="message"></div>


        <form id="loginForm">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >


            <a href="#"
               id="forgotPassword"
               class="forgot">

                Forgot password?

            </a>


            <button
                type="submit"
                id="loginBtn"
                class="login-btn">

                Login

            </button>

        </form>


        <div class="register-text">

            Don't have a GAM account?

            <a href="register.html">
                Create one
            </a>

        </div>

    </div>

</div>


<footer>

    <strong>
        GAM — Global Academy of Minds
    </strong>

    <p>
        Learn • Compete • Excel
    </p>

</footer>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey: "AIzaSyB_Hd_LkXjPKMyUJUD-ob2m4rOFepm9niU",

        authDomain: "gam-platform-59f1c.firebaseapp.com",

        projectId: "gam-platform-59f1c",

        storageBucket: "gam-platform-59f1c.firebasestorage.app",

        messagingSenderId: "423635446027",

        appId: "1:423635446027:web:7b42cd097b928ed7671a0e"

    };


    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const form =
        document.getElementById("loginForm");


    const email =
        document.getElementById("email");


    const password =
        document.getElementById("password");


    const loginBtn =
        document.getElementById("loginBtn");


    const message =
        document.getElementById("message");


    const forgotPassword =
        document.getElementById("forgotPassword");


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const userEmail =
                email.value.trim();

            const userPassword =
                password.value;


            if (!userEmail || !userPassword) {

                showMessage(
                    "Please enter your email and password.",
                    "error"
                );

                return;
            }


            loginBtn.disabled = true;

            loginBtn.textContent =
                "Logging in...";


            try {

                await signInWithEmailAndPassword(
                    auth,
                    userEmail,
                    userPassword
                );


                showMessage(
                    "Login successful! Opening your dashboard...",
                    "success"
                );


                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 1000);


            } catch (error) {

                console.error(error);

                let text =
                    "Login failed. Please try again.";


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    text =
                        "Incorrect email or password.";

                } else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    text =
                        "Please enter a valid email address.";

                } else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    text =
                        "Too many attempts. Please try again later.";

                }


                showMessage(text, "error");


                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login";

            }

        }
    );


    forgotPassword.addEventListener(
        "click",
        async function(event) {

            event.preventDefault();


            const userEmail =
                email.value.trim();


            if (!userEmail) {

                showMessage(
                    "Enter your email first, then tap Forgot password.",
                    "error"
                );

                return;
            }


            try {

                await sendPasswordResetEmail(
                    auth,
                    userEmail
                );


                showMessage(
                    "Password reset email sent. Check your inbox.",
                    "success"
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    "Unable to send the reset email. Check the email address.",
                    "error"
                );

            }

        }
    );

</script>


</body>

</html>
