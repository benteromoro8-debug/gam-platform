<script type="module">

from

const firebaseConfig = {

    apiKey:
        "AIzaSyB_Hd_LkXjPKMyUJUD-ob2m4rOFepm9niU",

    authDomain:
        "gam-platform-59f1c.firebaseapp.com",

    projectId:

    storageBucket:
        "gam-platform-59f1c.firebasestorage.app",

    messagingSenderId:
        "423635446027",

    appId:
        "1:423635446027:web:7b42cd097b928ed7671a0e"

};



const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const OWNER_UID =
    "Ib6GNciZ5kOEbOcCRlMLURoNTXG2";



const params =
    new URLSearchParams(
        window.location.search
    );


const contestId =
    params.get(
        "contestId"
    );



let sections = [];



const sectionsContainer =
    document.getElementById(
        "sectionsContainer"
    );


const totalMarks =
    document.getElementById(
        "totalMarks"
    );


const message =
    document.getElementById(

/* ---------------------------
   AUTHENTICATION
--------------------------- */

onAuthStateChanged(
    auth,
    async function(user) {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        if (
            user.uid !== OWNER_UID
        ) {

            document.body.innerHTML =
                "<h2 style='text-align:center;margin-top:100px;color:#a40000'>" +
                "Access denied. Owner only." +
                "</h2>";

            return;

        }


        if (!contestId) {

            showMessage(
                "No contest ID was provided.",
                "error"
            );

            return;

        }


        await loadContest();

    }
);



/* ---------------------------
   LOAD CONTEST
--------------------------- */

async function loadContest() {

    try {

        const contestRef =
            doc(
                db,
                "contests",
                contestId
            );


        const snap =
            await getDoc(
                contestRef
            );


        if (!snap.exists()) {

            showMessage(
                "Contest not found.",
                "error"
            );

            return;

        }


        const contest =
            snap.data();


        document
        .getElementById(
            "contestTitle"
        )
        .textContent =
            contest.name ||
            "GAM Contest";


        document
        .getElementById(
            "duration"
        )
        .value =
            contest.duration ||
            120;


        await loadPaper();

    }

    catch(error) {

        console.error(error);

        showMessage(
            "Could not load contest: " +
            error.message,
            "error"
        );

    }

}



/* ---------------------------
   LOAD PAPER
--------------------------- */

async function loadPaper() {

    try {

        const paperRef =
            doc(
                db,
                "contests",
                contestId,
                "paper",
                "main"
            );


        const snap =
            await getDoc(
                paperRef
            );


        if (!snap.exists()) {

            renderSections();

            return;

        }


        const data =
            snap.data();


        sections =
            Array.isArray(
                data.sections
            )
            ?
            data.sections
            :
            [];


        document
        .getElementById(
            "duration"
        )
        .value =
            data.duration ||
            120;


        document
        .getElementById(
            "paperStatus"
        )
        .value =
            data.status ||
            "draft";


        renderSections();

    }

    catch(error) {

        console.error(error);

        showMessage(
            "Could not load paper: " +
            error.message,
            "error"
        );

    }

}



/* ---------------------------
   ADD SECTION
--------------------------- */

document
.getElementById(
    "addSectionBtn"
)
.addEventListener(
    "click",
    function() {

        const letter =
            String.fromCharCode(
                65 +
                sections.length
            );


        sections.push({

            title:
                "Section " +
                letter,

            instructions:
                "",

            answerMode:
                "all",

            required:
                0,

            questions:
                []

        });


        renderSections();

        window.scrollTo(
            0,
            document.body.scrollHeight
        );

    }
);



/* ---------------------------
   RENDER SECTIONS
--------------------------- */

function renderSections() {

    sectionsContainer.innerHTML =
        "";


    if (
        sections.length === 0
    ) {

        sectionsContainer.innerHTML =
            '<div class="empty">' +
            'No sections created yet.<br><br>' +
            'Tap <strong>+ Add Section</strong> to begin.' +
            '</div>';

        updateTotal();

        return;

    }


    sections.forEach(
        function(section, sectionIndex) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "section-card";


            card.innerHTML =

                "<div class='section-title'>" +

                "<h2>" +
                escapeHTML(
                    section.title
                ) +
                "</h2>" +

                "<button " +
                "class='button danger' " +
                "data-remove-section='" +
                sectionIndex +
                "'>" +
                "Remove Section" +
                "</button>" +

                "</div>" +


                "<label>Section Title</label>" +

                "<input " +
                "data-section-title='" +
                sectionIndex +
                "' " +
                "value='" +
                escapeAttribute(
                    section.title
                ) +
                "'>" +


                "<label>Instructions</label>" +

                "<textarea " +
                "data-section-instructions='" +
                sectionIndex +
                "'>" +
                escapeHTML(
                    section.instructions
                ) +
                "</textarea>" +


                "<label>Answer Rule</label>" +

                "<select " +
                "data-answer-mode='" +
                sectionIndex +
                "'>" +

                "<option value='all' " +
                (
                    section.answerMode === "all"
                    ?
                    "selected"
                    :
                    ""
                ) +
                ">" +
                "Answer ALL questions" +
                "</option>" +

                "<option value='choose' " +
                (
                    section.answerMode === "choose"
                    ?
                    "selected"
                    :
                    ""
                ) +
                ">" +
                "Answer ANY specified number" +
                "</option>" +

                "</select>" +


                "<div " +
                "data-required-box='" +
                sectionIndex +
                "' " +
                "style='display:" +
                (
                    section.answerMode === "choose"
                    ?
                    "block"
                    :
                    "none"
                ) +
                ";'>" +

                "<label>Number to Answer</label>" +

                "<input " +
                "type='number' " +
                "min='1' " +
                "data-required='" +
                sectionIndex +
                "' " +
                "value='" +
                (
                    section.required ||
                    1
                ) +
                "'>" +

                "</div>" +


                "<div class='actions'>" +

                "<button " +
                "class='button primary' " +
                "data-add-question='" +
                sectionIndex +
                "'>" +
                "+ Add Question" +
                "</button>" +

                "</div>" +


                "<div " +
                "data-questions='" +
                sectionIndex +
                "'>" +

                "</div>";


            sectionsContainer.appendChild(
                card
            );


            renderQuestions(
                section,
                sectionIndex
            );

        }
    );


    attachSectionEvents();

    updateTotal();

}



/* ---------------------------
   RENDER QUESTIONS
--------------------------- */

function renderQuestions(
    section,
    sectionIndex
) {

    const container =
        document.querySelector(
            "[data-questions='" +
            sectionIndex +
            "']"
        );


    if (
        !section.questions ||
        section.questions.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">' +
            'No questions yet.' +
            '</div>';

        return;

    }


    section.questions.forEach(
        function(question, questionIndex) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "question-card";


            card.innerHTML =

                "<div class='question-number'>" +

                "Question " +
                (
                    questionIndex +
                    1
                ) +

                "</div>" +


                "<label>Question Text</label>" +

                "<textarea " +
                "data-question-text='" +
                sectionIndex +
                "-" +
                questionIndex +
                "'>" +
                escapeHTML(
                    question.text ||
                    ""
                ) +
                "</textarea>" +


                "<div class='grid'>" +

                "<div>" +

                "<label>Question Type</label>" +

                "<select " +
                "data-question-type='" +
                sectionIndex +
                "-" +
                questionIndex +
                "'>" +

                "<option value='written' " +
                (
                    question.type === "written"
                    ?
                    "selected"
                    :
                    ""
                ) +
                ">" +
                "Written Answer" +
                "</option>" +

                "<option value='multiple_choice' " +
                (
                    question.type === "multiple_choice"
                    ?
                    "selected"
                    :
                    ""
                ) +
                ">" +
                "Multiple Choice" +
                "</option>" +

                "</select>" +

                "</div>" +


                "<div>" +

                "<label>Marks</label>" +

                "<input " +
                "type='number' " +
                "min='0' " +
                "step='0.5' " +
                "data-question-marks='" +
                sectionIndex +
                "-" +
                questionIndex +
                "' " +
                "value='" +
                (
                    question.marks ||
                    1
                ) +
                "'>" +

                "</div>" +

                "</div>" +


                "<div class='actions'>" +

                "<button " +
                "class='button danger' " +
                "data-remove-question='" +
                sectionIndex +
                "-" +
                questionIndex +
                "'>" +

                "Remove Question" +

                "</button>" +

                "</div>";


            container.appendChild(
                card
            );

        }
    );


    attachQuestionEvents();

}



/* ---------------------------
   SECTION EVENTS
--------------------------- */

function attachSectionEvents() {

    document
    .querySelectorAll(
        "[data-remove-section]"
    )
    .forEach(
        function(button) {

            button.onclick =
                function() {

                    const index =
                        Number(
                            button.dataset
                            .removeSection
                        );


                    sections.splice(
                        index,
                        1
                    );


                    renderSections();

                };

        }
    );


    document
    .querySelectorAll(
        "[data-add-question]"
    )
    .forEach(
        function(button) {

            button.onclick =
                function() {

                    const index =
                        Number(
                            button.dataset
                            .addQuestion
                        );


                    sections[
                        index
                    ].questions.push({

                        text:
                            "",

                        type:
                            "written",

                        marks:
                            1

                    });


                    renderSections();

                };

        }
    );


    document
    .querySelectorAll(
        "[data-section-title]"
    )
    .forEach(
        function(input) {

            input.oninput =
                function() {

                    const index =
                        Number(
                            input.dataset
                            .sectionTitle
                        );


                    sections[
                        index
                    ].title =
                        input.value;

                };

        }
    );


    document
    .querySelectorAll(
        "[data-section-instructions]"
    )
    .forEach(
        function(input) {

            input.oninput =
                function() {

                    const index =
                        Number(
                            input.dataset
                            .sectionInstructions
                        );


                    sections[
                        index
                    ].instructions =
                        input.value;

                };

        }
    );


    document
    .querySelectorAll(
        "[data-answer-mode]"
    )
    .
