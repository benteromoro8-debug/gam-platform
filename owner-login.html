<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAM Owner Test</title>
<style>
body{font-family:Arial;background:#f4f7fb;padding:25px}
.box{max-width:500px;margin:40px auto;background:white;padding:25px;border-radius:15px}
button{width:100%;padding:14px;background:#ffd21f;border:0;border-radius:8px;font-weight:bold}
#result{margin-top:20px;padding:15px;word-break:break-all;line-height:1.7}
</style>
</head>

<body>

<div class="box">

<h2>GAM Owner Firestore Test</h2>

<button id="test">Test Owner Account</button>

<div id="result">Waiting...</div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    initializeFirestore,
    doc,
    getDocFromServer
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyB_Hd_LkXjPKMyUJUD-ob2m4rOFepm9niU",

    authDomain: "gam-platform-59f1c.firebaseapp.com",

    projectId: "gam-platform-59f1c",

    storageBucket: "gam-platform-59f1c.firebasestorage.app",

    messagingSenderId: "423635446027",

    appId: "1:423635446027:web:7b42cd097b928ed7671a0e"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/*
   EXPLICITLY USE THE DEFAULT FIRESTORE DATABASE
*/

const db = initializeFirestore(
    app,
    {},
    "(default)"
);


const result =
    document.getElementById("result");


document
.getElementById("test")
.addEventListener("click", async () => {

    try {

        const email =
            prompt("Enter Owner email:");

        const password =
            prompt("Enter Owner password:");

        if (!email || !password) {
            result.textContent =
                "Login cancelled.";
            return;
        }


        result.textContent =
            "Signing in...";


        const login =
            await signInWithEmailAndPassword(
                auth,
                email.trim(),
                password
            );


        const uid =
            login.user.uid;


        result.innerHTML =
            "Authentication successful.<br><br>" +
            "UID:<br>" +
            uid +
            "<br><br>Checking database (default)...";


        const reference =
            doc(
                db,
                "users",
                uid
            );


        const snapshot =
            await getDocFromServer(
                reference
            );


        if (!snapshot.exists()) {

            result.innerHTML =
                "<strong>DOCUMENT NOT FOUND</strong><br><br>" +
                "Database: (default)<br>" +
                "Collection: users<br>" +
                "Document ID:<br>" +
                uid;

            return;
        }


        const data =
            snapshot.data();


        result.innerHTML =
            "<strong>🎉 SUCCESS!</strong><br><br>" +
            "Document found.<br><br>" +
            "Name: " +
            (data.name || "") +
            "<br>" +
            "Email: " +
            (data.email || "") +
            "<br>" +
            "Role: " +
            (data.role || "");


    }

    catch (error) {

        result.innerHTML =
            "<strong>ERROR</strong><br><br>" +
            error.code +
            "<br><br>" +
            error.message;

        console.error(error);

    }

});

</script>

</body>
</html>
