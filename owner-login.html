<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAM Firestore Test</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    padding: 25px;
}

.box {
    max-width: 550px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.1);
}

h1 {
    color: #063b75;
}

button {
    width: 100%;
    padding: 14px;
    background: #ffd21f;
    color: #063b75;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: #f1f4f8;
    border-radius: 8px;
    word-break: break-all;
    line-height: 1.7;
}

.success {
    color: #087333;
}

.error {
    color: #a40000;
}

</style>

</head>


<body>


<div class="box">

<h1>
GAM Firestore Connection Test
</h1>

<p>
First log in to your Owner account.
</p>

<button id="test">
Test Firestore
</button>

<div
id="result"
class="result">

Waiting...

</div>

</div>


<script type="module">


import {
    initializeApp
}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    initializeFirestore,
    persistentLocalCache,
    doc,
    getDocFromServer
}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyB_Hd_LkXjPKMyUJUD-ob2m4rOFepm9niU",

    authDomain:
        "gam-platform-59f1c.firebaseapp.com",

    projectId:
        "gam-platform-59f1c",

    storageBucket:
        "gam-platform-59f1c.firebasestorage.app",

    messagingSenderId:
        "423635446027",

    appId:
        "1:423635446027:web:7b42cd097b928ed7671a0e"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


/*
 * Explicitly initialize
 * the Firestore connection.
 */

const db =
    initializeFirestore(
        app,
        {
            localCache:
                persistentLocalCache()
        }
    );


const button =
    document.getElementById(
        "test"
    );


const result =
    document.getElementById(
        "result"
    );


button.addEventListener(
    "click",
    async function() {


        button.disabled =
            true;


        result.textContent =
            "Signing in...";


        try {


            /*
             * Ask for the Owner
             * credentials.
             */

            const email =
                prompt(
                    "Enter your Owner email:"
                );


            const password =
                prompt(
                    "Enter your Owner password:"
                );


            const login =
                await signInWithEmailAndPassword(
                    auth,
                    email.trim(),
                    password
                );


            const user =
                login.user;


            result.innerHTML =
                "Authentication successful.<br><br>" +
                "UID:<br>" +
                user.uid +
                "<br><br>" +
                "Testing Firestore...";


            const ref =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const snapshot =
                await getDocFromServer(
                    ref
                );


            if (
                snapshot.exists()
            ) {


                const data =
                    snapshot.data();


                result.className =
                    "result success";


                result.innerHTML =
                    "<strong>🎉 SUCCESS!</strong><br><br>" +

                    "Document found.<br><br>" +

                    "<strong>UID:</strong><br>" +
                    user.uid +

                    "<br><br>" +

                    "<strong>Name:</strong><br>" +
                    (data.name || "") +

                    "<br><br>" +

                    "<strong>Email:</strong><br>" +
                    (data.email || "") +

                    "<br><br>" +

                    "<strong>Role:</strong><br>" +
                    (data.role || "");


            }

            else {


                result.className =
                    "result error";


                result.innerHTML =
                    "<strong>DOCUMENT NOT FOUND</strong><br><br>" +

                    "Path tested:<br>" +

                    "users/" +
                    user.uid;

            }


        }

        catch (error) {


            console.error(
                error
            );


            result.className =
                "result error";


            result.innerHTML =
                "<strong>ERROR</strong><br><br>" +

                error.code +
                "<br><br>" +

                error.message;

        }


        button.disabled =
            false;

    }
);

</script>

</body>
</html>
