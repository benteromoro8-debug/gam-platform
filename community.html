<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAM Community Test</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:30px 20px;
    text-align:center;
}

.box{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px 20px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h1{
    color:#063b75;
}

p{
    color:#687386;
}

button{
    border:0;
    padding:14px 20px;
    margin:8px;
    border-radius:9px;
    color:white;
    background:#063b75;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

#result{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#eef4fb;
    color:#063b75;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>🌍 GAM Africa Community</h1>

<p>
This is a temporary button test.
</p>

<button id="join">
+ Join Community
</button>

<button id="question">
❓ Ask a Question
</button>

<button id="report">
🚩 Report
</button>

<div id="result">
Waiting for an action...
</div>

</div>

<script>

document.getElementById("join").onclick = function(){

    document.getElementById("result").textContent =
    "✓ Join Community button is working!";

};

document.getElementById("question").onclick = function(){

    document.getElementById("result").textContent =
    "✓ Ask Question button is working!";

};

document.getElementById("report").onclick = function(){

    document.getElementById("result").textContent =
    "✓ Report button is working!";

};

console.log("GAM BUTTON TEST LOADED");

</script>

</body>
</html>
